# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2

updates:
  # npm/pnpm dependencies — grouped so routine bumps arrive as a few PRs, not dozens.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    # Two holds, both verified by installing the upgrade and running the
    # toolchain. Minor and patch updates still flow normally for everything.
    #
    # typescript: pinned entirely and bumped by hand. The 7.x line is a
    #   from-scratch compiler rewrite whose first stable release is very
    #   recent, and typescript-eslint throws "does not support TS 7.0" on
    #   load. Revisit when its peer range moves past <6.1.0.
    #
    # eslint: majors only. eslint 10 removed the legacy rule-context API and
    #   eslint-plugin-react still calls context.getFilename(), so linting dies
    #   with a TypeError before producing any output. eslint-plugin-import and
    #   -jsx-a11y also cap peers at ^9. Revisit when those ship eslint 10
    #   support — typescript-eslint already allows ^10.
    ignore:
      - dependency-name: typescript
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major
    groups:
      # Majors are split out because they are the ones needing a migration guide
      # read before merging.
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-major:
        dependency-type: production
        update-types:
          - major
      development-major:
        dependency-type: development
        update-types:
          - major

  # Keep the deploy workflow's actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    # The workflow pins floating major tags, which the publishers move forward
    # on every release. Patch and minor PRs are therefore noise at best, and
    # can even propose a version older than the tag already resolves to. Only
    # new majors need a human, since those are the ones that can break.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    groups:
      github-actions:
        patterns:
          - "*"
